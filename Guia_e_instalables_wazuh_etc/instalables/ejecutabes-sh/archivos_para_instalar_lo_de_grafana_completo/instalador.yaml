services:
  orquestador:
    image: ubuntu:22.04
    environment:
      - PWD=${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}
    working_dir: ${PWD}
    command:
    - bash
    - -c
    - |
      set -e
      apt-get update && apt-get install -y sudo git curl docker-compose-v2

      mkdir instalacion && cd instalacion

      #-------------
      #Script Wazuh
      #-------------
      mkdir wazuh-install && cd wazuh-install
      cat > instalar_wazuh.sh <<'SCRIPT'
      #!/bin/bash
      # Ejecuta los siguientes comando para generar el archivo y luego pega el contenido.
      # mkdir compose && cd compose && sudo nano instalar_wazuh.sh
      # sudo chmod +x instalar_wazuh.sh && ./instalar_wazuh.sh

      #Variables de configuración para wazuh
      Var_puerto_waz=5601
      Var_contrasena_admin_waz=SecretPassword
      Var_contrasena_Api_waz=MyS3cr37P450r.*-

      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[1;34m'
      NC='\033[0m' # Sin color

      set -e  # Detener ejecución si hay errores

      echo -e "$${BLUE}🛠️  Iniciando instalación de Wazuh en Docker...$${NC}"
      echo -e "$${YELLOW}📦 Actualizando repositorios...$${NC}"
      sudo apt-get update

      echo -e "$${YELLOW}🔧 Clonando Repositorio oficial ...$${NC}"
      git clone https://github.com/wazuh/wazuh-docker.git -b v4.14.8

      echo -e "$${YELLOW} Entrando en directorio ...$${NC}"
      cd wazuh-docker/single-node

      echo -e "$${YELLOW}🔑 Generando certificados...$${NC}"
      rm -rf config/certs.yml
      git checkout config/certs.yml 2>/dev/null || true

      # Cambiar la ruta relativa '.' por la ruta absoluta dinámica en el YAML de Wazuh
      sed -i "s|- .:/config|- $$(pwd):/config|g" generate-indexer-certs.yml

      # Tu comando de siempre
      sudo docker compose -f generate-indexer-certs.yml run --rm generator

      echo -e "$${YELLOW}🔧 Cambiando puerto del dashboard...$${NC}"
      sed -i -e '/wazuh.dashboard:/,/ports:/ {' -e '/ports:/ {n; s/- 443:5601/- '"$$Var_puerto_waz"':5601/;}' -e '}' docker-compose.yml

      echo -e "$${YELLOW}🔧 Introduciendo contraseña al admin...$${NC}"
      sed -i -e '/wazuh.indexer:/,/environment/{' -e '/environment:/a \      - OPENSEARCH_INITIAL_ADMIN_PASSWORD='"$$Var_contrasena_admin_waz"'|' -e '}' docker-compose.yml
      sed -i -e '/wazuh.manager:/,/INDEXER_PASSWORD=/ {' -e '/INDEXER_PASSWORD=/ {s/INDEXER_PASSWORD=.*/INDEXER_PASSWORD='"$$Var_contrasena_admin_waz"'/;}' -e '}' docker-compose.yml
      sed -i -e '/wazuh.dashboard:/,/INDEXER_PASSWORD=/ {' -e '/INDEXER_PASSWORD=/ {s/INDEXER_PASSWORD=.*/INDEXER_PASSWORD='"$$Var_contrasena_admin_waz"'/;}' -e '}' docker-compose.yml
      HASH_ADMIN=$$(sudo docker run --rm wazuh/wazuh-indexer:4.14.8 /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$$Var_contrasena_admin_waz" | tail -n 1)
      sed -i -e '/admin:/,/reserved:/ {' -e 's|hash:.*|hash: \"'"$$HASH_ADMIN"'"|' -e '}' config/wazuh_indexer/internal_users.yml

      echo -e "$${YELLOW}🔧 Cambiando contrasena de la API...$${NC}"
      sed -i -e '/wazuh.manager:/,/API_PASSWORD=/ {' -e '/API_PASSWORD=/ {s/API_PASSWORD=.*/API_PASSWORD='"$$Var_contrasena_Api_waz"'/;}' -e '}' docker-compose.yml
      sed -i -e '/wazuh.dashboard:/,/API_PASSWORD=/ {' -e '/API_PASSWORD=/ {s/API_PASSWORD=.*/API_PASSWORD='"$$Var_contrasena_Api_waz"'/;}' -e '}' docker-compose.yml

      echo -e "$${YELLOW}🔧 Cambiando contrasena de la API en wazu_dashboard...$${NC}"
      sed -i -e '/hosts:/,/password:/ {' -e '/password:/ {s/password:.*/password: "'"$$Var_contrasena_Api_waz"'"/;}' -e '}' config/wazuh_dashboard/wazuh.yml

      echo -e "$${YELLOW}📦 Creando contenedor...$${NC}"
      sudo docker compose up -d

      echo -e "$${GREEN}✅ Wazuh instalado correctamente.$${NC}"
      SCRIPT

      chmod +x instalar_wazuh.sh && ./instalar_wazuh.sh && rm -r instalar_wazuh.sh
      cd ..

      #-------------
      #Script Prometheus
      #-------------
      mkdir prometheus-install && cd prometheus-install
      cat > instalar_prometheus.sh <<'SCRIPT'
      #!/bin/bash
      # Ejecuta los siguientes comando para generar el archivo y luego pega el contenido.
      # mkdir compose && cd compose && sudo nano instalar_prometheus.sh
      # sudo chmod +x instalar_prometheus.sh && ./instalar_prometheus.sh

      #Variables de configuración para prometheus
      Var_nombre_network=single-node_default

      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[1;34m'
      NC='\033[0m' # Sin color

      set -e  # Detener ejecución si hay errores

      echo -e "$${BLUE}🛠️  Iniciando instalación de Prometheus en Docker...$${NC}"

      echo -e "$${YELLOW}🔧 Creando estructura de carpetas...$${NC}"
      mkdir prometheus-server
      mkdir prometheus-server/prometheus
      mkdir prometheus-server/data

      echo -e "$${YELLOW} Entrando encarpeta prometheus-server...$${NC}"
      cd prometheus-server

      echo -e "$${YELLOW} Creando docker-compose...$${NC}"
      cat > docker-compose.yml <<EOF
      version: '3.8'

      services:
        prometheus:
          image: prom/prometheus:latest
          container_name: prometheus
          user: "root"
          ports:
            - "9090:9090"
          volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./data:/prometheus
          command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
          restart: unless-stopped
          networks:
            - red_wazuh
          depends_on:
            - node-exporter

        node-exporter:
          image: prom/node-exporter:latest
          container_name: node-exporter
          restart: unless-stopped
          ports:
            - "9100:9100"
          pid: host
          networks:
            - red_wazuh

      networks:
        red_wazuh:
          name: $${Var_nombre_network}
          external: true
      EOF

      echo -e "$${YELLOW} Creando prometheus yml...$${NC}"
      cat > prometheus/prometheus.yml <<EOF
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: "node-exporter-local"
          static_configs:
            - targets: ["node-exporter:9100"]
              labels:
                nodename: "Servidor"
      EOF

      echo -e "$${YELLOW}🔧 Iniciando contenedor...$${NC}"
      sudo docker compose up -d

      echo -e "$${GREEN}✅ Prometheus instalado correctamente.$${NC}"
      SCRIPT

      chmod +x instalar_prometheus.sh && ./instalar_prometheus.sh && rm -r instalar_prometheus.sh
      cd ..
      
      #-------------
      # Script Grafana
      #-------------
      mkdir grafana-install && cd grafana-install
      cat > instalar_grafana.sh <<'SCRIPT'
      set -e # Detener ejecución si hay errores

      VAR_PUERTO_GRAF=3000
      VAR_USUARIO_ADMIN_GRAF="admin"
      VAR_CONTRASENA_ADMIN_GRAF="SecretPassword"
      VAR_NOMBRE_IMAGEN="grafana/grafana:latest"
      VAR_NOMBRE_CONTENEDOR="grafana"
      VAR_NOMBRE_NETWORK="single-node_default"
      VAR_VOLUME_NAME="grafana_data"

      # Colores para salida en consola
      GREEN='\033[0;32m'
      YELLOW='\033[1;33m'
      BLUE='\033[1;34m'
      NC='\033[0m'

      echo -e "$${BLUE}🛠️  Iniciando instalación optimizada de Grafana en Docker...$${NC}"

      if ! sudo docker network inspect "$$VAR_NOMBRE_NETWORK" >/dev/null 2>&1; then
          echo -e "$${YELLOW}🌐 Creando la red de Docker '$${VAR_NOMBRE_NETWORK}'...$${NC}"
          sudo docker network create "$$VAR_NOMBRE_NETWORK"
      fi

      if ! sudo docker volume inspect "$$VAR_VOLUME_NAME" >/dev/null 2>&1; then
          echo -e "$${YELLOW}💾 Creando volumen de datos persistente '$${VAR_VOLUME_NAME}'...$${NC}"
          sudo docker volume create "$$VAR_VOLUME_NAME"
      fi

      echo -e "$${YELLOW}📦 Descargando imagen oficial de Grafana...$${NC}"
      sudo docker pull "$$VAR_NOMBRE_IMAGEN"

      if sudo docker ps -a --format '{{.Names}}' | grep -q "^$${VAR_NOMBRE_CONTENEDOR}$$"; then
          echo -e "$${YELLOW}⚠️  Eliminando contenedor previo de Grafana...$${NC}"
          sudo docker rm -f "$$VAR_NOMBRE_CONTENEDOR"
      fi

      echo -e "$${YELLOW}🚀 Desplegando contenedor de Grafana...$${NC}"
      sudo docker run -d \
        --name "$$VAR_NOMBRE_CONTENEDOR" \
        --restart unless-stopped \
        --network "$$VAR_NOMBRE_NETWORK" \
        -p "$${VAR_PUERTO_GRAF}:3000" \
        -e "GF_SECURITY_ADMIN_USER=$${VAR_USUARIO_ADMIN_GRAF}" \
        -e "GF_SECURITY_ADMIN_PASSWORD=$${VAR_CONTRASENA_ADMIN_GRAF}" \
        -v "$${VAR_VOLUME_NAME}:/var/lib/grafana" \
        "$$VAR_NOMBRE_IMAGEN"

      echo -e "$${GREEN}✅ Grafana instalado y ejecutándose correctamente.$${NC}"
      SCRIPT

      chmod +x instalar_grafana.sh && ./instalar_grafana.sh && rm -r instalar_grafana.sh